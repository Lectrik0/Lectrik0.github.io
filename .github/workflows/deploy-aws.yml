name: Deploy to AWS

# Runs on every push to main once the AWS stack exists and the repo variables are set.
# No AWS keys are stored in GitHub: the job gets short-lived credentials through OIDC.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # needed to request the OIDC token

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
    steps:
      # Actions are pinned to full commit SHAs so a moved tag can't change what runs.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build here too, so AWS gets pages that match data/site.json even when this push
      # (e.g. a Backstage edit) hasn't been rebuilt by the CI workflow yet.
      - name: Check content and build pages
        run: |
          npm ci --no-audit --no-fund
          npm run check:content
          npm run build
          npm test

      - name: Render the CV as a PDF
        run: |
          npx playwright install --with-deps chromium
          npm run pdf

      - name: Collect the public files
        run: |
          set -euo pipefail
          mkdir _site
          cp -r index.html cv.html cv.pdf card.html 404.html robots.txt sitemap.xml feed.xml assets writeups backstage .well-known _site/

      - name: Get short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: site-deploy-${{ github.run_id }}

      - name: Upload site files
        working-directory: _site
        run: |
          set -euo pipefail
          # Assets first (cached for a day; pages link them with ?v= stamps, so a changed file is fetched fresh),
          # then pages, feeds, text files and the CV PDF, which browsers revalidate on every visit.
          aws s3 sync . "s3://${SITE_BUCKET}" --delete --only-show-errors \
            --exclude "*.html" --exclude "*.xml" --exclude "*.txt" --exclude "*.pdf" --cache-control "public, max-age=86400"
          aws s3 sync . "s3://${SITE_BUCKET}" --only-show-errors \
            --exclude "*" --include "*.html" --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          aws s3 sync . "s3://${SITE_BUCKET}" --only-show-errors \
            --exclude "*" --include "*.xml" --cache-control "no-cache" --content-type "application/xml; charset=utf-8"
          aws s3 sync . "s3://${SITE_BUCKET}" --only-show-errors \
            --exclude "*" --include "*.txt" --cache-control "no-cache" --content-type "text/plain; charset=utf-8"
          aws s3 sync . "s3://${SITE_BUCKET}" --only-show-errors \
            --exclude "*" --include "*.pdf" --cache-control "no-cache" --content-type "application/pdf"

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*" --query Invalidation.Id --output text
